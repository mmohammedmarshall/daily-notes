
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daily Notes</title>
<style>
body{font-family:Arial,sans-serif;background:#f4f6f9;padding:30px}
main{max-width:600px;margin:auto;background:white;padding:25px;border-radius:12px}
textarea{width:100%;height:120px;padding:10px;box-sizing:border-box}
button{padding:10px 18px;background:#2563eb;color:white;border:0;border-radius:6px;cursor:pointer}
.note{padding:12px;background:#eef2ff;margin-top:10px;border-radius:6px}
</style>
</head>
<body>
<main>
<h1>Daily Notes</h1>
<p>Write and save your daily thoughts.</p>
<textarea id="note" placeholder="Write your note..."></textarea>
<br><br>
<button onclick="saveNote()">Save Note</button>
<div id="notes"></div>
</main>
<script>
function loadNotes(){
 const notes=JSON.parse(localStorage.getItem("dailyNotes")||"[]");
 document.getElementById("notes").innerHTML="";
 notes.forEach(note=>{
  const item=document.createElement("div");
  item.className="note";
  item.textContent=note;
  document.getElementById("notes").appendChild(item);
 });
}
function saveNote(){
 const input=document.getElementById("note");
 if(!input.value.trim()) return;
 const notes=JSON.parse(localStorage.getItem("dailyNotes")||"[]");
 notes.unshift(input.value.trim());
 localStorage.setItem("dailyNotes",JSON.stringify(notes));
 input.value="";
 loadNotes();
}
loadNotes();
</script>
</body>
</html>
