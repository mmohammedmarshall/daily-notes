
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Daily Notes</title>
<style>
body{font:16px Arial;max-width:760px;margin:35px auto;padding:16px}
input,textarea,select,button{padding:10px;margin:5px}
textarea{width:95%;height:90px}
.note{border:1px solid #ccc;padding:12px;margin:10px 0}
</style>
</head>
<body>
<h1>Daily Notes</h1>
<input id="title" placeholder="Note title">
<select id="category">
<option>Personal</option><option>Work</option><option>Study</option>
</select>
<textarea id="content" placeholder="Write a note..."></textarea>
<button id="add">Save Note</button>
<p>
<input id="search" placeholder="Search notes...">
<select id="filter">
<option>All</option><option>Personal</option>
<option>Work</option><option>Study</option>
</select>
</p>
<ul id="notes"></ul>
<script>
const notes=[];
const $=id=>document.getElementById(id);

function render(){
 const q=$('search').value.toLowerCase();
 const cat=$('filter').value;
 $('notes').innerHTML='';
 notes.forEach((n,i)=>{
  if((cat==='All'||n.category===cat)&&
  (n.title+' '+n.content).toLowerCase().includes(q)){
   const li=document.createElement('li');
   li.className='note';
   li.textContent=n.title+' - '+n.content+' ('+n.category+')';
   const del=document.createElement('button');
   del.textContent='Delete';
   del.onclick=()=>{notes.splice(i,1);render()};
   li.append(del);
   $('notes').append(li);
  }
 });
}

$('add').onclick=()=>{
 const title=$('title').value.trim();
 const content=$('content').value.trim();
 if(!title||!content)return alert('Enter title and note.');
 notes.unshift({title,content,category:$('category').value});
 $('title').value='';
 $('content').value='';
 render();
};
$('search').oninput=render;
$('filter').onchange=render;
</script>
</body>
</html>
